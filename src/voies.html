<div class="text-center">
  <div v-if="!edition" class="row mx-0 mt-3">
    <div class="col text-bg-light d-flex justify-content-between">
      <span></span>
      <span class="px-2">Capacités</span>
      <span class="px-2">{{ points_de_maitrise[0] }} / {{ points_de_maitrise[1] }}</span>
    </div>
  </div>
  <ul class="list-group">
    <li v-for="vt in voies" class="list-group-item p-0 text-center">
      <button class="btn w-100" data-bs-toggle="collapse" :data-bs-target="'#'+vt[0]" aria-expanded="false">
        {{ pp_voie(vt[0]) }}
      </button>
      <ul class="list-group collapse" :id="vt[0]">
        <li v-for="c in liste_voies[vt[0]]" class="list-group-item list-group-item-action p-0" :class="(capacite_choisie(vt[0], c.rang)) ? 'active' : ''">
          <div @click="choisit_capacite(vt[0], c.rang)" role="button">
            <div class="w-100 d-flex">
              <span class="border border-secondary border-2 px-3">{{ c.rang }}</span>
              <strong class="flex-fill text-bg-light">{{ c.nom }}</strong>
            </div>
            <div v-if="c.action.length!=0 || c.sort" class="row mx-0">
              <div v-if="c.sort" class="col border border-secondary">sort</div>
              <div v-if="c.action.length!=0" class="col border border-secondary">{{ c.action.join(' / ') }}</div>
            </div>
            <p class="mb-0 p-2">{{ c.description }}</p>
            <div v-if="c.html" v-html="c.html"></div>
          </div>
          <div class="d-flex flex-wrap justify-content-center">
            <div v-for="(b, j) in c.bonus.filter((b) => b.opt!==undefined)" class="p-2">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" :checked="b.opt" @change="function (ev) { choisit_bonus_capacite(ev, vt[0], c.rang, c.nom, b) }" :id="'creation-voies-bonus-'+c.rang+'-'+b.id"/>
                <label class="form-check-label" :for="'creation-voies-bonus-'+c.rang+'-'+b.id">{{ b.id }}+{{ b.valeur }}</label>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </li>
  </ul>
</div>
