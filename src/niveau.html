<div class="text-center">
  <div class="d-flex justify-content-center">
    <button class="btn btn-light" @click="change(niveau-1)"><i class="bi bi-dash"></i></button>
    <input type="number" class="form-control text-center" v-model="niveau" style="width:60px" @change="change(niveau)"/>
    <button class="btn btn-light" @click="change(niveau+1)"><i class="bi bi-plus"></i></button>
  </div>
</div>
