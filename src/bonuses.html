<div>
  <div v-for="(b, i) in bonuses" class="row mx-0 text-center">
    <div class="col p-0 border">{{ b[0] }}</div>
    <div class="col p-0 border">{{ b[1].id }}</div>
    <div class="col p-0 border">{{ b[1].valeur }}</div>
    <div class="col p-0 border">
      <button class="btn py-0 w-100 h-100" @click="bonuses.splice(i, 1)"><i class="bi bi-trash3"></i></button>
    </div>
  </div>
  <div class="row mx-0">
    <div class="col p-0 border">
      <input class="form-control py-0" v-model="bonus[0]"/>
    </div>
    <div class="col p-0 border">
      <select class="form-select py-0" v-model="bonus[1].id">
        <option v-for="id in bonus_ids" :value="id">{{ id }}</option>
      </select>
    </div>
    <div class="col p-0 border">
      <input class="form-control py-0" v-model="bonus[1].valeur"/>
    </div>
    <div class="col p-0 border">
      <button class="btn py-0 w-100" @click="ajoute_bonus()"><i class="bi bi-plus"></i></button>
    </div>
  </div>
</div>
