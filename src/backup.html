<div>
  <div class="text-center m-5">Backup</div>
  <ul class="list-group">
    <template v-for="(p, i) in list">
      <li class="list-group-item">
        <div class="row text-center">
          <div class="col-2">{{p[0]}}</div>
          <div class="col-2">{{p[1].nom}}</div>
          <div class="col-2">{{p[1].niveau}}</div>
          <div class="col-2">
            <button class="btn w-50 py-0" type="button" data-bs-toggle="collapse" :data-bs-target="'#backup-edite-'+String(i)">
              <i class="bi bi-pencil-square"></i>
            </button>
          </div>
          <div class="col-2">
            <button class="btn w-50 py-0" @click="telecharge_raw_personnage(p[0], p[1])">
              <i class="bi bi-download"></i>
            </button>
          </div>
          <div class="col-2">
            <button class="btn py-0" @click="detruit_personnage(p[0])">
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>
      </li>
      <div class="collapse text-center" :id="'backup-edite-'+String(i)">
        <textarea :id="'backup-textarea-'+String(i)" class="form-control w-100" rows="10">{{ p[1] }}</textarea>
        <button class="btn btn-secondary m-2" @click="sauvegarde_raw_personnage(p[0], i)">Edite</button>
      </div>
    </template>
  </ul>
</div>
