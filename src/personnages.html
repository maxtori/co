<div>
  <div v-if="list.length!==0" class="my-5 w-75 mx-auto">
    <div v-for="(p, i) in list" class="card text-center border border-dark border-5 my-3" style="--bs-card-bg:none">
      <div class="card-header" @click="personnage(p)" role="button">
        {{ p.label }}
      </div>
      <div v-if="p.perso.nom" class="card-body d-flex justify-content-center" @click="personnage(p)" role="button">
        <h1 class="me-5">{{ p.perso.nom }}</h1>
        <div class="pt-1">
          <span class="text-bg-light px-4 py-1 fw-bolder" :style="wavy_cadre(i+1)">{{ p.perso.niveau }}</span>
        </div>
      </div>
      <div class="card-footer text-body-secondary">
        <div class="row mx-0">
          <div class="col d-flex border-secondary border-end">
            <button class="btn py-0 flex-fill" @click="telecharge_personnage(p.label, p.perso)">
              <i class="bi bi-download"></i>
            </button>
          </div>
          <div class="col d-flex border-secondary border-end">
            <button class="btn py-0 flex-fill" @click="copie_lien_personnage(p.label, p.perso)">
              <i class="bi bi-share"></i>
            </button>
          </div>
          <div class="col d-flex">
            <button class="btn py-0 flex-fill" @click="detruit_personnage(p.label)">
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
